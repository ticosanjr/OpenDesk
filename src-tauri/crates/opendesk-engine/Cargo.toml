[package]
name = "opendesk-engine"
version = "1.7.0"
description = "OpenDesk execution engine: scheduler, queue, runner, telemetry"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.3"
futures-util = "0.3"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
opendesk-domain = { path = "../opendesk-domain" }
opendesk-storage = { path = "../opendesk-storage" }
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "process", "io-util", "io-std", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
