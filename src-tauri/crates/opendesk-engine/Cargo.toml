[package]
name = "opendesk-engine"
version = "1.3.1"
description = "OpenDesk execution engine: scheduler, queue, runner, telemetry"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.3"
opendesk-domain = { path = "../opendesk-domain" }
opendesk-storage = { path = "../opendesk-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
