[package]
name = "opendesk-storage"
version = "1.7.0"
description = "OpenDesk SQLite storage: V2 baseline, pools and repositories"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
iana-time-zone = "0.1"
opendesk-domain = { path = "../opendesk-domain" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
