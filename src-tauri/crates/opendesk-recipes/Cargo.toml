[package]
name = "opendesk-recipes"
version = "1.4.0"
description = "OpenDesk recipes: parser, DAG and HITL flow"
edition = "2024"
license = "MIT"

[dependencies]
jsonschema = { version = "0.49", default-features = false }
opendesk-domain = { path = "../opendesk-domain" }
opendesk-storage = { path = "../opendesk-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
