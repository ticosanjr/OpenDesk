[package]
name = "opendesk-recipes"
version = "1.7.0"
description = "OpenDesk recipes: parser, DAG and HITL flow"
edition = "2024"
license = "MIT"

[dependencies]
rand = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jsonschema = { version = "0.49", default-features = false }
opendesk-engine = { path = "../opendesk-engine" }
opendesk-domain = { path = "../opendesk-domain" }
opendesk-storage = { path = "../opendesk-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.3"
serde_yaml = "0.9.34"
similar = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.11.1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
