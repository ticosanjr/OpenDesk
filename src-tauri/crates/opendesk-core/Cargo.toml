[package]
name = "opendesk-core"
version = "1.3.1"
description = "OpenDesk domain foundation shared by the desktop shell, daemon, CLI and nodes"
edition = "2024"
license = "MIT"

[lib]
name = "opendesk_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
opendesk-domain = { path = "../opendesk-domain" }
opendesk-storage = { path = "../opendesk-storage" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.3"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
html-escape = "0.3"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
iana-time-zone = "0.1"
jsonschema = { version = "0.49", default-features = false }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
serde_yaml = "0.9.34"
similar = "2"
sha2 = "0.11.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "process", "io-util", "io-std", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tar = "0.4"
unicode-normalization = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
walkdir = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
webauthn-rs = { version = "0.6", default-features = false, features = ["danger-allow-state-serialisation"] }
zip = "9.4.1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
