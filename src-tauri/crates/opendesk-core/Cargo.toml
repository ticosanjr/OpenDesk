[package]
name = "opendesk-core"
version = "1.2.0"
description = "OpenDesk domain foundation shared by the desktop shell, daemon, CLI and nodes"
edition = "2024"
license = "MIT"

[lib]
name = "opendesk_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
