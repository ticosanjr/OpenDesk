[package]
name = "opendesk-channels"
version = "1.10.0"
description = "OpenDesk omni-channel registry and notification routing"
edition = "2024"
license = "MIT"

[features]
default = []
ch-telegram = []
ch-whatsapp = []
ch-whatsapp-qr = ["ch-whatsapp"]
ch-email = []
ch-signal = []
ch-webpush = []
ch-discord = []
ch-slack = []

[dependencies]
anyhow = "1"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
opendesk-engine = { path = "../opendesk-engine" }
opendesk-storage = { path = "../opendesk-storage" }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
tracing = "0.1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
async-trait = "0.1"
sha2 = "0.11.1"
hmac = "0.12"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt", "process", "io-util", "net"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
opendesk-domain = { path = "../opendesk-domain" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
