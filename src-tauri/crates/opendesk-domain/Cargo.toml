[package]
name = "opendesk-domain"
version = "1.8.0"
description = "Pure OpenDesk domain: IDs, state machines, events and ports"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }

