[package]
name = "opendesk-mcp"
version = "1.9.1"
description = "OpenDesk MCP gateway: rate limiting and RBAC"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
opendesk-engine = { path = "../opendesk-engine" }
opendesk-storage = { path = "../opendesk-storage" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
