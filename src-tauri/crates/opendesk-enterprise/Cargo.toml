[package]
name = "opendesk-enterprise"
version = "1.8.0"
description = "OpenDesk enterprise: auth, cluster, computer-use and eval"
edition = "2024"
license = "MIT"

[features]
default = ["ent-auth", "ent-computer", "ent-cluster", "ent-eval"]
ent-auth = []
ent-cluster = []
ent-computer = []
ent-eval = []

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
opendesk-engine = { path = "../opendesk-engine" }
opendesk-storage = { path = "../opendesk-storage" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49", default-features = false }
sha2 = "0.11.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
zstd = "0.13"
tar = "0.4"
async-trait = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
