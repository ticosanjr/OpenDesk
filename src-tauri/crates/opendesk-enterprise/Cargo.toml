[package]
name = "opendesk-enterprise"
version = "1.4.0"
description = "OpenDesk enterprise: auth, cluster, computer-use and eval"
edition = "2024"
license = "MIT"

[features]
default = ["ent-auth", "ent-computer"]
ent-auth = []
ent-cluster = []
ent-computer = []
ent-eval = []

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
opendesk-storage = { path = "../opendesk-storage" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"
