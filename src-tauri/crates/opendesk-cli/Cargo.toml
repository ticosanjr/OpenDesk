[package]
name = "opendesk-cli"
version = "1.10.0"
edition = "2024"

[[bin]]
name = "opendesk-cli"
path = "src/main.rs"

[dependencies]
opendesk = { path = "../..", default-features = false }
opendesk-storage = { path = "../opendesk-storage" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
