[package]
name = "opendesk"
version = "0.12.0"
description = "OpenDesk — visual governance, automation and observability for OpenCode"
authors = ["OpenDesk"]
edition = "2024"

[lib]
name = "opendesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
directories = "6"
secrecy = "0.10"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
serde_yaml = "0.9.34"
sha2 = "0.11.1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
walkdir = "2"
tauri-plugin-dialog = "2.8.4"
futures-util = "0.3.34"
unicode-normalization = "0.1.26"
croner = "4.0.3"
chrono-tz = "0.10.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
html-escape = "0.3.0"
open = "5.4.5"
pulldown-cmark = "0.13.6"
tracing-appender = "0.2.5"
semver = "1.0.28"
zip = "9.4.1"
iana-time-zone = "0.1.65"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
