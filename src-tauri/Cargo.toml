[package]
name = "opendesk"
version = "1.4.0"
description = "OpenDesk — visual governance, automation and observability for OpenCode"
authors = ["OpenDesk"]
edition = "2024"
default-run = "opendesk"

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-global-shortcut",
]

[[bin]]
name = "opendesk"
path = "src/main.rs"
required-features = ["desktop"]

[workspace]
members = ["crates/opendesk-core", "crates/opendesk-domain", "crates/opendesk-storage", "crates/opendesk-engine", "crates/opendesk-recipes", "crates/opendesk-mcp", "crates/opendesk-channels", "crates/opendesk-enterprise", "crates/opendesk-daemon", "crates/opendesk-cli", "crates/opendesk-node"]
default-members = [".", "crates/opendesk-core", "crates/opendesk-domain", "crates/opendesk-storage", "crates/opendesk-engine", "crates/opendesk-recipes", "crates/opendesk-mcp", "crates/opendesk-channels", "crates/opendesk-enterprise"]
resolver = "2"

[lib]
name = "opendesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opendesk-core = { path = "crates/opendesk-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "any", "postgres", "mysql", "migrate", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
directories = "6"
secrecy = "0.10"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
serde_yaml = "0.9.34"
sha2 = "0.11.1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
walkdir = "2"
include_dir = "0.7"
tauri-plugin-dialog = { version = "2.8.4", optional = true }
futures-util = "0.3.34"
unicode-normalization = "0.1.26"
croner = "4.0.3"
chrono-tz = "0.10.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
html-escape = "0.3.0"
open = "5.4.5"
pulldown-cmark = "0.13.6"
tracing-appender = "0.2.5"
semver = "1.0.28"
similar = "2"
tar = "0.4"
zstd = "0.13"
zip = "9.4.1"
iana-time-zone = "0.1.65"
tauri-plugin-notification = { version = "2.8.0", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
async-trait = "0.1.92"
calamine = "0.38.0"
rust_xlsxwriter = "0.102.0"
pdf-extract = "0.12.1"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
mail-parser = "1.0.1"
serde_json_path = "0.7.2"
jsonschema = { version = "0.49", default-features = false }
html2text = "0.17.4"
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }
hmac = "0.13.0"
tokio-native-tls = "0.3.1"
native-tls = "0.2.18"
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
p256 = { version = "0.13", features = ["ecdsa"] }
webauthn-rs = { version = "0.6", default-features = false, features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
