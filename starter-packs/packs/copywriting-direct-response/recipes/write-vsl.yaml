id: write-vsl
name: Escrever VSL
description: VSL completa.
enabled: true
triggers: []
flow:
- type: step
  id: passo-1
  name: Estruturar oferta
  mode: build
  agent: offer-architect
  effort: medium
  prompt: Defina promessa, prova e oferta. Salve em {{run.output_dir}}/01-estruturar-oferta.md.
- type: step
  id: passo-2
  name: Redigir
  mode: build
  agent: copy-drafter
  effort: medium
  prompt: Escreva VSL em cenas. Salve em {{run.output_dir}}/02-redigir.md.
- type: step
  id: passo-3
  name: Quebrar objeções
  mode: build
  agent: objection-destroyer
  effort: medium
  prompt: Insira neutralizadores. Salve em {{run.output_dir}}/03-quebrar-objeções.md.
- type: hitl
  id: checkpoint-final
  name: Revisão humana
  interaction_type: APPROVAL_WITH_FEEDBACK
  channels:
  - DESKTOP_UI
  timeout_minutes: 240
  on_timeout: PAUSE_AND_ALERT
  prompt_template: Revise o resultado antes de concluir?
