id: detecta-assinaturas
name: Detectar assinaturas
description: Encontra cobranças recorrentes.
enabled: true
triggers: []
flow:
- type: step
  id: passo-1
  name: Detectar
  mode: build
  agent: analista-assinaturas
  effort: medium
  prompt: Analise extratos e recibos em casa/financas/input/ e liste assinaturas recorrentes com custo
    anual. Salve em {{run.output_dir}}/assinaturas.md.
