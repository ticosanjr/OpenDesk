id: audit-deliveries
name: Auditar entregas
description: Atrasos e gargalos.
enabled: true
triggers: []
flow:
- type: step
  id: passo-1
  name: Ler rastreios
  mode: build
  agent: logistics-tracker
  effort: medium
  prompt: Normalize status e identifique estagnação. Salve em {{run.output_dir}}/01-ler-rastreios.md.
- type: step
  id: passo-2
  name: Priorizar
  mode: build
  agent: fulfillment-clerk
  effort: medium
  prompt: Liste ações de expedição e atendimento. Salve em {{run.output_dir}}/02-priorizar.md.
